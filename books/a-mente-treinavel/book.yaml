kdp:
  description: |       # também a contracapa impressa, um parágrafo por bloco
    A mente treinável é para quem parte do zero e quer entender a meditação
    direito: de onde ela vem, o que ela faz e o que ela não faz.

    O livro começa pelo budismo como os próprios textos o apresentam: as
    Quatro Nobres Verdades, a impermanência e o não-eu, e o caminho do qual a
    meditação é só uma parte. E mantém a tradição separada da versão de
    autoajuda que costuma vir junto.

    Depois passa à ciência: como ler um estudo, o que a neuroplasticidade
    significa e o que não significa, a mente que divaga, o estresse, a
    atenção, a emoção e o hábito. Cada resultado em que o livro se apoia leva
    um rótulo com a força da evidência (forte, moderada, preliminar ou
    contestada), e o livro aponta o exagero onde ele existe: amostras
    pequenas, controles fracos, replicações que falharam, exames do cérebro
    lidos com confiança demais.

    A última parte ensina as práticas passo a passo: atenção na respiração,
    observar sem agarrar, bondade e compaixão, o corpo. Um capítulo inteiro
    trata do que acontece quando a meditação dá errado, dos efeitos adversos
    documentados a quando parar e buscar ajuda.

    A meditação não substitui tratamento, e este livro não finge o contrário.
  keywords:             # as mesmas sete buscas da edição inglesa, em português
    - meditação para iniciantes
    - budismo explicado
    - ciência da meditação
    - neuroplasticidade
    - mindfulness e pesquisa científica
    - meditação baseada em evidências
    - efeitos adversos da meditação
  categories:           # Livros Kindle, como escolhidos na KDP em 2026-10-19
