<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1404" height="756" viewBox="0 0 520 280" font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>
<rect x="0" y="0" width="520" height="280" fill="#ffffff"/>
<rect x="10" y="10" width="430" height="112" rx="6" fill="#e3e3e3" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="24" y="36" font-size="16" font-weight="bold">1. A sensação</text>
<text x="24" y="58" font-size="15">Onde dói, quanto, de que tipo: pontada, peso, calor.</text>
<text x="24" y="86" font-size="15"><tspan font-style="italic">Na tradição: a primeira flecha</tspan></text>
<text x="24" y="106" font-size="15"><tspan font-style="italic">No laboratório: a intensidade</tspan></text>
<path d="M 225,124 L 225,154" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="10" y="158" width="430" height="112" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="24" y="184" font-size="16" font-weight="bold">2. A reação à sensação</text>
<text x="24" y="206" font-size="15">Alarme, previsão, resistência: “isso não vai passar”.</text>
<text x="24" y="234" font-size="15"><tspan font-style="italic">Na tradição: a segunda flecha</tspan></text>
<text x="24" y="254" font-size="15"><tspan font-style="italic">No laboratório: o desagrado</tspan></text>
<path d="M 452,14 L 462,14 L 462,266 L 452,266" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="0" y="0" font-size="15" font-weight="bold" text-anchor="middle" transform="translate(486 140) rotate(-90)">Passo 6: notar cada uma à parte</text>
</svg>
