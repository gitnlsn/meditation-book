# vale is NOT a gate for this edition, and this file records why.
#
# The packages available are English style linters and this manuscript is
# Portuguese. Configured as it ships, the spellchecker does not know Portuguese
# and flags essentially every word; `alex` reads `que` as profanity. The same
# experiment on Manual da Vida produced 2.981 alerts across 45 chapters, every
# one of them a false positive.
#
# A gate with false positives is worse than no gate: people learn to ignore it,
# and then they ignore the one alert that was real. So vale is kept installed
# and unused, and CLAUDE.md says never to report it as passing or failing.
#
# The two gates that mean something here are:
#     make marcadores    unresolved [[?...]] markers
#     make check         KDP preflight
#
# If a Portuguese vale package ever becomes available, the useful rules for
# this book are not the style ones -- they are hype detectors: "comprovado",
# "a ciência prova", "cura", "reprograma o cérebro", and exclamation marks.
# Those are real faults in a book about evidence and a linter can see them.

StylesPath = .vale
MinAlertLevel = error

[*.md]
